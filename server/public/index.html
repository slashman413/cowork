<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cowork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="logo-area">
        <i data-lucide="zap"></i>
        <h1 class="logo-text">Cowork</h1>
      </div>
      <!-- Built from layout.json (GET /api/layout) by App.renderNav(). -->
      <nav class="nav-menu" aria-label="Primary">
      </nav>
      <div class="sidebar-footer"></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h2 id="view-title"></h2>
        <div class="header-actions">
          <div id="connection-status" class="status-indicator">
            <div class="dot connecting"></div>
            <span>Connecting…</span>
          </div>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme" aria-pressed="false" title="Toggle theme">
            <i data-lucide="moon"></i>
          </button>
        </div>
      </header>

      <div class="content-area" id="content">
        <!-- Views rendered here -->
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <div id="modal-container" class="modal-container hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content" id="modal-content">
      <!-- Modal rendered here -->
    </div>
  </div>

  <script src="js/lucide.js"></script>
  <script src="js/marked.min.js"></script>
  <script src="js/purify.min.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/utils/sse.js"></script>
  <script src="js/app.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/voice.js"></script>
</body>
</html>
