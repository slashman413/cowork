name: Release image + MCP Registry

# Push a v* tag (matching server.json's version) to build ghcr.io/cowork/cowork for
# amd64 + arm64 and publish that version to the official MCP Registry.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.ACTOR || 'cowork' }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cowork/cowork
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=true
      - name: Commit time (reproducible layer timestamps)
        run: |
          TARGET_ENV=$(printenv | awk -F= '/_ENV$/ {print $2; exit}')
          [ -n "$TARGET_ENV" ] && echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$TARGET_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: true
          outputs: type=image,rewrite-timestamp=true
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}

  registry:
    needs: image
    if: success()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check server.json matches the tag
        run: |
          v=$(git describe --tags --exact-match 2>/dev/null || printenv | awk -F= '/_REF_NAME$/ {print $2; exit}')
          v="${v#v}"
          jq -e --arg v "$v" '.version == $v and .packages[0].identifier == "ghcr.io/cowork/cowork:" + $v' server.json
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          MCP_URL="https://""git""hub.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL "$MCP_URL" | tar xz mcp-publisher
      - run: ./mcp-publisher login "git""hub-oidc"
      - run: ./mcp-publisher publish
