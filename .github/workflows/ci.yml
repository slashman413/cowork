name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    env:
      # The fleet runs on Taiwan time; recurrence calendar math (daily/weekly/
      # monthly/cron) uses the server's local TZ, so CI must match it.
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'
      - name: Install Dependencies
        run: npm ci || npm install
      - name: Run Tests
        run: npm run test
