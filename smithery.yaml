# Smithery.ai MCP Server Configuration for Cowork MCP
# Repository: https://github.com/slashman413/cowork
# Official MCP Registry ID: io.github.slashman413/cowork
# Container entrypoint: WORKDIR /app/server -> CMD ["node", "dist/index.js"]
# Transport: Streamable HTTP MCP at /mcp (honors COWORK_PORT, then PORT, default 6868)

runtime: "container"

build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."

startCommand:
  type: "http"
  configSchema:
    type: object
    required: []
    properties:
      coworkApiKey:
        type: string
        title: "Cowork API Key"
        description: "Optional Bearer token (COWORK_API_KEY) for /mcp and /api. If omitted in container mode, Cowork generates a key into /data/api-key on first start and prints it once to stdout."
      coworkPort:
        type: integer
        title: "Server Port"
        default: 6868
        description: "Listening HTTP port for Cowork MCP (/mcp) and the Web Dashboard (mapped to COWORK_PORT; when unset, honors container runtime PORT or defaults to 6868)."
      coworkAllowedHosts:
        type: string
        title: "Allowed Host Headers"
        default: ""
        description: "Optional comma-separated extra Host header allowlist entries for reverse-proxy or hosted deployments (mapped to COWORK_ALLOWED_HOSTS)."
  exampleConfig:
    coworkApiKey: "replace-with-strong-random-token"
    coworkPort: 6868
    coworkAllowedHosts: ""
